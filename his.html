<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kostas's Portal</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            background-color: #0b0e14; /* Deep space background */
            color: #d1d5db; 
        }
        .container { 
            max-width: 450px; 
            margin: 30px auto; 
            background: #161b22; /* Obsidian surface */
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15); 
            border: 1px solid #30363d;
            border-top: 6px solid #00d4ff; /* Electric blue accent */
        }
        h2 { text-align: center; color: #ffffff; margin-bottom: 5px; font-weight: 700; }
        h4 { text-align: center; color: #8b949e; margin-top: 0; margin-bottom: 25px; font-weight: 300; letter-spacing: 0.5px; }
        
        .section { 
            background: rgba(255, 255, 255, 0.03); 
            padding: 18px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #30363d; 
        }
        
        label { font-weight: bold; margin-top: 10px; display: block; font-size: 13px; color: #00d4ff; text-transform: uppercase; letter-spacing: 1px; }
        
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            background-color: #0b0e14; 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            box-sizing: border-box; 
            color: #ffffff;
            font-size: 15px;
            transition: border-color 0.3s ease;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
        }

        button { 
            width: 100%; 
            padding: 15px; 
            margin-top: 10px; 
            background: linear-gradient(135deg, #00d4ff 0%, #007bff 100%); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }
        
        button:hover { 
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        
        button:active { transform: translateY(0); }
        button:disabled { background: #30363d; box-shadow: none; cursor: not-allowed; opacity: 0.6; }

        #status { 
            text-align: center; 
            margin-top: 20px; 
            font-size: 14px; 
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kostas's Portal 🛰️</h2>
    <h4>Send to Depi</h4>
    
    <div class="section">
        <label>My Pager's Title:</label>
        <input type="text" id="myTitle" value="Kostas">

        <label>My Current City:</label>
        <input type="text" id="myCity" value="Athens, Greece">
    </div>

    <div class="section">
        <label>Message for Depi:</label>
        <textarea id="messageBox" rows="4" placeholder="Type your message here..."></textarea>
    </div>

    <button onclick="processAndSend()" id="sendBtn">Sync & Send Signal</button>

    <div id="status"></div>
</div>

<script>
    /* Logic remains identical to ensure functionality */
    const myUrl = "https://love-pager-27704-default-rtdb.europe-west1.firebasedatabase.app/LovePagers/HisDevice.json";
    const herUrl = "https://love-pager-27704-default-rtdb.europe-west1.firebasedatabase.app/LovePagers/HerDevice.json";

    async function getCoords(city) {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`);
        const data = await res.json();
        if(data.length > 0) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        return null;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
    }

    async function processAndSend() {
        const title = document.getElementById("myTitle").value;
        const city = document.getElementById("myCity").value;
        const msg = document.getElementById("messageBox").value;
        const statusDiv = document.getElementById("status");
        const btn = document.getElementById("sendBtn");

        if(city.trim() === "" || title.trim() === "") {
            statusDiv.style.color = "#ff6b6b"; statusDiv.innerText = "Please fill in Title and City!"; return;
        }

        btn.disabled = true;
        statusDiv.style.color = "#00d4ff";
        statusDiv.innerText = "Calculating trajectory...";

        try {
            let herCity = "Thessaloniki, Greece"; 
            const peekRes = await fetch(herUrl);
            const peekData = await peekRes.json();
            if(peekData && peekData.my_city) { herCity = peekData.my_city; }

            const loc1 = await getCoords(city);
            const loc2 = await getCoords(herCity);

            if(!loc1 || !loc2) {
                statusDiv.style.color = "#ff6b6b"; statusDiv.innerText = "City not found!";
                btn.disabled = false; return;
            }

            const distanceKm = getDistance(loc1.lat, loc1.lon, loc2.lat, loc2.lon);
            statusDiv.innerText = `Distance: ${distanceKm} km. Syncing...`;

            const myPayload = { pager_title: title, my_city: city, distance_km: distanceKm.toString() };
            await fetch(myUrl, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(myPayload) });

            const herPayload = { distance_km: distanceKm.toString() };
            if (msg.trim() !== "") {
                herPayload.message = msg;
                herPayload.new_message_alert = true;
            }
            await fetch(herUrl, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(herPayload) });

            statusDiv.style.color = "#51cf66";
            statusDiv.innerText = msg.trim() !== "" ? `Success! Signal sent (${distanceKm}km).` : `Settings synced!`;
            document.getElementById("messageBox").value = ""; 
        } catch (error) {
            statusDiv.style.color = "#ff6b6b"; statusDiv.innerText = "Sync failed.";
        }
        btn.disabled = false;
    }
</script>
</body>
</html>
