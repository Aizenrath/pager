<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kostas's Portal</title>
    <style>
        /* Dark Theme Overhaul for Kostas */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background-color: #0d1117; 
            color: #c9d1d9;
        }
        .container { 
            max-width: 450px; 
            margin: 40px auto; 
            background: #161b22; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            border-top: 5px solid #00a2ff; 
        }
        h2 { text-align: center; color: #ffffff; margin-bottom: 5px; }
        h4 { text-align: center; color: #8b949e; margin-top: 0; margin-bottom: 25px; font-weight: normal; }
        
        .section { 
            background: #21262d; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            border: 1px solid #30363d; 
        }
        
        label { font-weight: bold; margin-top: 10px; display: block; font-size: 14px; color: #58a6ff; }
        
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            background-color: #0d1117; 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            box-sizing: border-box; 
            color: #f0f6fc;
            font-size: 15px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 5px rgba(88, 166, 255, 0.3);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 10px; 
            background-color: #238636; /* Green for "Send/Sync" action */
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s ease;
        }
        /* Overriding button to the Blue theme if you prefer blue over green */
        #sendBtn { background-color: #007bff; }
        #sendBtn:hover { background-color: #00a2ff; }
        #sendBtn:disabled { background-color: #484f58; cursor: not-allowed; }

        #status { 
            text-align: center; 
            margin-top: 20px; 
            font-weight: bold; 
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kostas's Portal 🛰️</h2>
    <h4>Send to Depi</h4>
    
    <div class="section">
        <label>My Pager's Title (Updates YOUR screen):</label>
        <input type="text" id="myTitle" value="Kostas">

        <label>My Current City:</label>
        <input type="text" id="myCity" value="Athens, Greece">
    </div>

    <div class="section">
        <label>Message for Depi (Optional):</label>
        <textarea id="messageBox" rows="4" placeholder="Leave blank to just update settings..."></textarea>
    </div>

    <button onclick="processAndSend()" id="sendBtn">Sync Settings & Send</button>

    <div id="status"></div>
</div>

<script>
    const myUrl = "https://love-pager-27704-default-rtdb.europe-west1.firebasedatabase.app/LovePagers/HisDevice.json";
    const herUrl = "https://love-pager-27704-default-rtdb.europe-west1.firebasedatabase.app/LovePagers/HerDevice.json";

    async function getCoords(city) {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`);
        const data = await res.json();
        if(data.length > 0) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        return null;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
    }

    async function processAndSend() {
        const title = document.getElementById("myTitle").value;
        const city = document.getElementById("myCity").value;
        const msg = document.getElementById("messageBox").value;
        const statusDiv = document.getElementById("status");
        const btn = document.getElementById("sendBtn");

        if(city.trim() === "" || title.trim() === "") {
            statusDiv.style.color = "#f85149"; statusDiv.innerText = "Please fill in your Title and City!"; return;
        }

        btn.disabled = true;
        statusDiv.style.color = "#58a6ff";
        statusDiv.innerText = "Locating Depi & calculating distance...";

        try {
            let herCity = "London, UK"; 
            const peekRes = await fetch(herUrl);
            const peekData = await peekRes.json();
            if(peekData && peekData.my_city) { herCity = peekData.my_city; }

            const loc1 = await getCoords(city);
            const loc2 = await getCoords(herCity);

            if(!loc1 || !loc2) {
                statusDiv.style.color = "#f85149"; statusDiv.innerText = "Could not find one of the cities!";
                btn.disabled = false; return;
            }

            const distanceKm = getDistance(loc1.lat, loc1.lon, loc2.lat, loc2.lon);
            statusDiv.innerText = `Distance: ${distanceKm} km. Syncing...`;

            const myPayload = { pager_title: title, my_city: city, distance_km: distanceKm.toString() };
            await fetch(myUrl, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(myPayload) });

            const herPayload = { distance_km: distanceKm.toString() };
            if (msg.trim() !== "") {
                herPayload.message = msg;
                herPayload.new_message_alert = true;
            }
            await fetch(herUrl, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(herPayload) });

            statusDiv.style.color = "#3fb950";
            statusDiv.innerText = msg.trim() !== "" ? `Success! Message sent (${distanceKm}km away).` : `Success! Settings synced (${distanceKm}km away).`;
            document.getElementById("messageBox").value = ""; 
        } catch (error) {
            statusDiv.style.color = "#f85149"; statusDiv.innerText = "Error syncing with pagers.";
        }
        btn.disabled = false;
    }
</script>
</body>
</html>
