<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depi's Portal 🎀</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            background-color: #1a1617; /* Very dark chocolate/rose tint */
            color: #fce4ec; 
        }
        .container { 
            max-width: 450px; 
            margin: 20px auto; 
            background: #2d2426; /* Dark berry-tinted charcoal */
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.2); 
            border: 1px solid #4a3539;
            border-top: 6px solid #ff4d6d; /* Bright girly pop */
        }
        h2 { text-align: center; color: #ff85a1; margin-bottom: 5px; font-weight: 800; }
        h4 { text-align: center; color: #c9ada7; margin-top: 0; margin-bottom: 25px; font-weight: 300; letter-spacing: 1px; }
        
        .section { 
            background: rgba(255, 77, 109, 0.05); 
            padding: 18px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            border: 1px solid #5a3d42; 
        }
        
        label { font-weight: bold; margin-top: 10px; display: block; font-size: 13px; color: #ff85a1; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            background-color: #1a1617; 
            border: 1px solid #4a3539; 
            border-radius: 10px; 
            box-sizing: border-box; 
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #ff4d6d;
            box-shadow: 0 0 8px rgba(255, 77, 109, 0.4);
        }

        button { 
            width: 100%; 
            padding: 15px; 
            margin-top: 10px; 
            background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(201, 24, 74, 0.4);
            transition: transform 0.2s ease;
        }
        
        button:hover { 
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%); 
        }
        
        button:active { transform: translateY(0); }
        button:disabled { background: #4a3539; box-shadow: none; cursor: not-allowed; }

        #status { text-align: center; margin-top: 20px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Depi's Portal 🎀</h2>
    <h4>Send Love to Kostas</h4>
    
    <div class="section">
        <label>My Pager's Title:</label>
        <input type="text" id="myTitle" value="Depi Spiniara">

        <label>My Current City:</label>
        <input type="text" id="myCity" value="Thessaloniki, Greece">
    </div>

    <div class="section">
        <label>Message for Kostas 💌</label>
        <textarea id="messageBox" rows="4" placeholder="Write something sweet..."></textarea>
    </div>

    <button onclick="processAndSend()" id="sendBtn">Sync & Send</button>

    <div id="status"></div>
</div>

<script>
    /* JavaScript logic remains the same to keep functionality intact */
    const myUrl = "https://love-pager-27704-default-rtdb.europe-west1.firebasedatabase.app/LovePagers/HerDevice.json";
    const hisUrl = "https://love-pager-27704-default-rtdb.europe-west1.firebasedatabase.app/LovePagers/HisDevice.json";

    async function getCoords(city) {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`);
        const data = await res.json();
        if(data.length > 0) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        return null;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
    }

    async function processAndSend() {
        const title = document.getElementById("myTitle").value;
        const city = document.getElementById("myCity").value;
        const msg = document.getElementById("messageBox").value;
        const statusDiv = document.getElementById("status");
        const btn = document.getElementById("sendBtn");

        if(city.trim() === "" || title.trim() === "") {
            statusDiv.style.color = "#ff758f"; statusDiv.innerText = "Please fill in your Title and City!"; return;
        }

        btn.disabled = true;
        statusDiv.style.color = "#8093f1";
        statusDiv.innerText = "Finding Kostas...";

        try {
            let hisCity = "Athens, Greece"; 
            const peekRes = await fetch(hisUrl);
            const peekData = await peekRes.json();
            if(peekData && peekData.my_city) { hisCity = peekData.my_city; }

            const loc1 = await getCoords(city);
            const loc2 = await getCoords(hisCity);

            if(!loc1 || !loc2) {
                statusDiv.style.color = "#ff758f"; statusDiv.innerText = "City not found!";
                btn.disabled = false; return;
            }

            const distanceKm = getDistance(loc1.lat, loc1.lon, loc2.lat, loc2.lon);
            statusDiv.innerText = `Distance: ${distanceKm} km. Sending...`;

            const myPayload = { pager_title: title, my_city: city, distance_km: distanceKm.toString() };
            await fetch(myUrl, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(myPayload) });

            const hisPayload = { distance_km: distanceKm.toString() };
            if (msg.trim() !== "") {
                hisPayload.message = msg;
                hisPayload.new_message_alert = true;
            }
            await fetch(hisUrl, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(hisPayload) });

            statusDiv.style.color = "#b7e4c7";
            statusDiv.innerText = "Sent successfully! ✨";
            document.getElementById("messageBox").value = ""; 
        } catch (error) {
            statusDiv.style.color = "#ff758f"; statusDiv.innerText = "Connection error.";
        }
        btn.disabled = false;
    }
</script>
</body>
</html>
