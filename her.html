<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depi's Portal</title>
    <style>
        /* Dark Theme Overhaul */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background-color: #121212; 
            color: #e0e0e0;
        }
        .container { 
            max-width: 450px; 
            margin: 40px auto; 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border-top: 5px solid #ff4d5a; 
        }
        h2 { text-align: center; color: #ffffff; margin-bottom: 5px; }
        h4 { text-align: center; color: #b0b0b0; margin-top: 0; margin-bottom: 25px; font-weight: normal; }
        
        .section { 
            background: #2a2a2a; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            border: 1px solid #3d3d3d; 
        }
        
        label { font-weight: bold; margin-top: 10px; display: block; font-size: 14px; color: #ff4d5a; }
        
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            background-color: #121212; 
            border: 1px solid #444; 
            border-radius: 8px; 
            box-sizing: border-box; 
            color: #ffffff;
            font-size: 15px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #ff4d5a;
            box-shadow: 0 0 5px rgba(255, 77, 90, 0.3);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 10px; 
            background-color: #ff4d5a; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s ease;
        }
        button:hover { background-color: #e63946; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        #status { 
            text-align: center; 
            margin-top: 20px; 
            font-weight: bold; 
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Depi's Portal 💌</h2>
    <h4>Send to Kostas</h4>
    
    <div class="section">
        <label>My Pager's Title (Update Name):</label>
        <input type="text" id="myTitle" value="Depi Spiniara">

        <label>My Current City:</label>
        <input type="text" id="myCity" value="Thessaloniki, Greece">
    </div>

    <div class="section">
        <label>Message for Kostas (Optional):</label>
        <textarea id="messageBox" rows="4" placeholder="Leave blank to just update settings..."></textarea>
    </div>

    <button onclick="processAndSend()" id="sendBtn">Sync Settings & Send</button>

    <div id="status"></div>
</div>

<script>
    // Logic remains exactly the same as your original script
    const myUrl = "https://love-pager-27704-default-rtdb.europe-west1.firebasedatabase.app/LovePagers/HerDevice.json";
    const hisUrl = "https://love-pager-27704-default-rtdb.europe-west1.firebasedatabase.app/LovePagers/HisDevice.json";

    async function getCoords(city) {
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`);
            const data = await res.json();
            if(data.length > 0) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        } catch (e) { console.error(e); }
        return null;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
    }

    async function processAndSend() {
        const title = document.getElementById("myTitle").value;
        const city = document.getElementById("myCity").value;
        const msg = document.getElementById("messageBox").value;
        const statusDiv = document.getElementById("status");
        const btn = document.getElementById("sendBtn");

        if(city.trim() === "" || title.trim() === "") {
            statusDiv.style.color = "#ff4d5a"; statusDiv.innerText = "Please fill in your Title and City!"; return;
        }

        btn.disabled = true;
        statusDiv.style.color = "#4dabf7";
        statusDiv.innerText = "Locating Kostas & calculating distance...";

        try {
            let hisCity = "Athens, Greece"; 
            const peekRes = await fetch(hisUrl);
            const peekData = await peekRes.json();
            if(peekData && peekData.my_city) { hisCity = peekData.my_city; }

            const loc1 = await getCoords(city);
            const loc2 = await getCoords(hisCity);

            if(!loc1 || !loc2) {
                statusDiv.style.color = "#ff4d5a"; statusDiv.innerText = "Could not find one of the cities!";
                btn.disabled = false; return;
            }

            const distanceKm = getDistance(loc1.lat, loc1.lon, loc2.lat, loc2.lon);
            statusDiv.innerText = `Distance: ${distanceKm} km. Syncing...`;

            const myPayload = { pager_title: title, my_city: city, distance_km: distanceKm.toString() };
            await fetch(myUrl, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(myPayload) });

            const hisPayload = { distance_km: distanceKm.toString() };
            if (msg.trim() !== "") {
                hisPayload.message = msg;
                hisPayload.new_message_alert = true;
            }
            await fetch(hisUrl, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(hisPayload) });

            statusDiv.style.color = "#51cf66";
            statusDiv.innerText = msg.trim() !== "" ? `Success! Message sent (${distanceKm}km away).` : `Success! Settings synced (${distanceKm}km away).`;
            document.getElementById("messageBox").value = ""; 
        } catch (error) {
            statusDiv.style.color = "#ff4d5a"; statusDiv.innerText = "Error syncing with pagers.";
        }
        btn.disabled = false;
    }
</script>
</body>
</html>
